services:

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: coupons
      POSTGRES_USER: couponUser
      POSTGRES_PASSWORD: couponPass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 10